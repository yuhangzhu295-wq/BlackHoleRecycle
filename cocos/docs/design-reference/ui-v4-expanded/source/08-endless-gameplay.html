<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shared.css">
<title>08 Endless Gameplay</title>
<style>
  /* Reference 08 is a single real gameplay frame, not a diagram of one.
     Every element below is something a player would actually see. Spec
     commentary, tier labels and the space-budget legend live in
     design-lock.md §08 and gameplay-composition-contract.md, never in the PNG.
     `data-bucket` is inert markup used only by the renderer's measurement pass. */

  /* ---- top-down low-poly city ground (no sky band: matches master 01) ---- */
  .grass { position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.045) 0 2px, transparent 2px 72px),
      linear-gradient(180deg,#9BDC78 0%,#8ED36B 46%,#7FC65A 100%); }

  .road-h { position:absolute; left:0; top:596px; width:720px; height:104px;
    background:#6E7480; border-top:6px solid #575C66; border-bottom:6px solid #575C66; }
  .road-v { position:absolute; left:268px; top:0; width:104px; height:1280px;
    background:#6E7480; border-left:6px solid #575C66; border-right:6px solid #575C66; }
  .road-h .dash { position:absolute; top:48px; left:0; width:720px; height:10px;
    background: repeating-linear-gradient(90deg,#F2E9C8 0 46px,transparent 46px 92px); }
  .road-v .dash { position:absolute; left:47px; top:0; width:10px; height:1280px;
    background: repeating-linear-gradient(180deg,#F2E9C8 0 46px,transparent 46px 92px); }
  .zebra { position:absolute; background:#F2E9C8; }
  .pave { position:absolute; background:#CFE7B4; border:5px solid rgba(16,24,39,.18); border-radius:14px; }

  /* ---- low-poly 2.5D block: roof face on top of a wall face ---- */
  .b3d { position:absolute; }
  .b3d .wall { position:absolute; left:0; bottom:0; width:100%;
    border:6px solid var(--ink); border-radius:0 0 10px 10px; }
  .b3d .roof { position:absolute; left:-9px; top:0; width:calc(100% + 18px); height:44px;
    border:6px solid var(--ink); border-radius:12px; transform:skewX(-14deg); }
  .b3d .win { position:absolute; border-radius:6px; background:#BFE6FF;
    border:5px solid var(--ink); opacity:.92; }
  .b3d .door { position:absolute; bottom:0; border-radius:8px 8px 0 0;
    background:#5B4636; border:5px solid var(--ink); }

  .sh { position:absolute; border-radius:50%; background: rgba(16,24,39,.22); filter: blur(2px); }

  /* ---- black hole (player) ---- */
  .bh { position:absolute; left:238px; top:806px; width:168px; height:168px; }
  .bh .pull { position:absolute; inset:-52px; border-radius:50%;
    border:7px dashed rgba(46,123,255,.42); }
  .bh .disc { position:absolute; inset:0; border-radius:50%; border:7px solid var(--ink);
    background: radial-gradient(circle at 50% 50%,#04060D 0%,#04060D 42%,#16255F 58%,#2E7BFF 74%,#5FE9FF 88%,rgba(95,233,255,0) 100%); }
  .bh .core { position:absolute; left:50%; top:50%; width:52px; height:52px;
    margin:-26px 0 0 -26px; border-radius:50%;
    background: radial-gradient(circle,#FFF 0%,#BFF3FF 46%,rgba(191,243,255,0) 76%); }

  /* Master 01 ships flat dark HUD pills with cream ink; this page inherits the
     shared opaque `--panel-pill` token from _shared.css rather than overriding
     it. Pause uses the shared gold chrome from _shared.css, matching master 01. */
</style>
</head>
